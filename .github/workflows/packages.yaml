name: Build packages

on:
  pull_request:
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/packages.yaml"
  push:
    branches: [master]
    paths:
      - "pkgs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/packages.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-packages:
    name: Discover Packages
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.filtered-packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Get packages from flake
        id: get-packages
        run: |
          ARCHS=$(
            nix eval --json --no-pure-eval --allow-import-from-derivation .#packages --apply builtins.attrNames \
            | jq -r '.[]'
          )
          INCLUDE_JSON='[]'
          for ARCH in $ARCHS; do
            PKGS=$(
              nix eval --json --no-pure-eval --allow-import-from-derivation ".#packages.${ARCH}" --apply builtins.attrNames \
              | jq -r '.[] | select(startswith("devenv-") | not)'
            )
            for PKG in $PKGS; do
              ERRFILE=$(mktemp)
              if BROKEN=$(nix eval --json --no-pure-eval --allow-import-from-derivation ".#packages.${ARCH}.${PKG}.meta.broken" 2>"$ERRFILE"); then
                if echo "$BROKEN" | jq -e '. == true' >/dev/null; then
                  echo "Skipping broken package $PKG on $ARCH"
                else
                  INCLUDE_JSON=$(echo "$INCLUDE_JSON" | jq --arg pkg "$PKG" --arg arch "$ARCH" '. + [{package:$pkg, arch:$arch}]')
                fi
              else
                echo "Skipping unevaluable package $PKG on $ARCH"
                sed 's/^/  /' "$ERRFILE" >&2
              fi
              rm -f "$ERRFILE"
            done
          done
          if [ "$(echo "$INCLUDE_JSON" | jq 'length')" -eq 0 ]; then
            MATRIX_JSON='[]'
          else
            MATRIX_JSON=$(jq -n --argjson include "$INCLUDE_JSON" '{include:$include}')
          fi
          echo "Calculated matrix: $MATRIX_JSON"
          {
            echo 'matrix<<EOF'
            echo "$MATRIX_JSON"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Filter to changed packages
        id: filtered-packages
        uses: workflow/nix-shell-action@v4.0.0
        env:
          # The package matrix is multi-line JSON, so it is passed through env
          # instead of being interpolated into the script with ${{ }}.
          # Interpolating it inside a double-quoted shell string strips the
          # JSON's own double quotes and yields invalid JSON ("jq: parse error:
          # Invalid numeric literal"), which broke this step on every push and
          # made the matrix output unusable for the build-packages job.
          FULL_MATRIX: ${{ steps.get-packages.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        with:
          packages: gawk
          script: |
            set -euo pipefail

            set_matrix() {
              {
                echo 'matrix<<EOF'
                printf '%s\n' "$1"
                echo EOF
              } >> "$GITHUB_OUTPUT"
            }

            if [ "$EVENT_NAME" != "push" ]; then
              echo "Not a push event ($EVENT_NAME); keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable before SHA; keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            git fetch origin "$BEFORE_SHA" --depth=1

            # If flake.lock changed, check if the nixpkgs input changed; if so, keep full matrix
            if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- flake.lock | grep -q 'flake.lock'; then
              echo "flake.lock changed, checking nixpkgs input change..."
              # Try to obtain previous flake.lock; if unavailable, assume nixpkgs changed
              if git show "$BEFORE_SHA:flake.lock" > /tmp/old.lock 2>/dev/null; then
                :
              else
                echo "Previous flake.lock not available; assuming nixpkgs changed. Keeping full matrix."
                set_matrix "$FULL_MATRIX"
                exit 0
              fi

              OLD_NIXPKGS=$(jq -r '
                (.root) as $r
                | (.nodes[$r].inputs.nixpkgs // "nixpkgs") as $n0
                | ($n0 | if type=="string" then . else (.[0] // "nixpkgs") end) as $n
                | (.nodes[$n].locked // {})
                | [(.rev // "none"), (.narHash // "none")] | join("|")
              ' /tmp/old.lock 2>/dev/null || echo "none|none")

              NEW_NIXPKGS=$(jq -r '
                (.root) as $r
                | (.nodes[$r].inputs.nixpkgs // "nixpkgs") as $n0
                | ($n0 | if type=="string" then . else (.[0] // "nixpkgs") end) as $n
                | (.nodes[$n].locked // {})
                | [(.rev // "none"), (.narHash // "none")] | join("|")
              ' flake.lock 2>/dev/null || echo "none|none")

              if [ "$OLD_NIXPKGS" != "$NEW_NIXPKGS" ]; then
                echo "nixpkgs input changed ($OLD_NIXPKGS -> $NEW_NIXPKGS). Keeping full matrix."
                set_matrix "$FULL_MATRIX"
                exit 0
              else
                echo "nixpkgs input did not change."
              fi
            fi

            # flake.nix defines the package outputs and inputs, so any change to
            # it can affect any package. This also covers pushes that touch
            # flake.nix or this workflow but nothing under pkgs/, where the
            # package diff below would be empty.
            if git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- flake.nix | grep -q 'flake.nix'; then
              echo "flake.nix changed; keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- pkgs/)
            if [ -z "$CHANGED_FILES" ]; then
              echo "No changes in pkgs; keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            # pkgs/default.nix defines the package set, so a change there can
            # affect any package.
            if printf '%s\n' "$CHANGED_FILES" | grep -qx 'pkgs/default.nix'; then
              echo "pkgs/default.nix changed; keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            # Derive candidate package names from the changed paths. pkgs/ uses
            # the layouts pkgs/<pkg>/..., pkgs/<category>/<pkg>.nix and
            # pkgs/<category>/<pkg>/default.nix, so a changed file can name its
            # package via its first path component, via the parent directory of
            # a default.nix, or via its own file stem. Candidates are
            # intersected with the discovered package list below, so extra
            # candidates are harmless. (Naming a package after the basename of
            # every changed file instead produced junk entries such as
            # "app.rs"/"Cargo.toml" for packages that carry a source tree.)
            CANDIDATES=$(
              printf '%s\n' "$CHANGED_FILES" \
              | awk -F'/' '
                  {
                    if (NF > 1) print $2
                    if ($NF == "default.nix" && NF > 1) print $(NF - 1)
                    if ($NF != "default.nix") {
                      stem = $NF
                      sub(/\.[^.]*$/, "", stem)
                      if (stem != "") print stem
                    }
                  }
                ' \
              | sort -u
            )
            echo "Candidate packages from changed paths:"
            printf '%s\n' "$CANDIDATES"

            CANDIDATES_JSON=$(printf '%s\n' "$CANDIDATES" | jq -R -s 'split("\n") | map(select(length > 0))')
            SELECTED=$(printf '%s' "$FULL_MATRIX" | jq -c --argjson pkgs "$CANDIDATES_JSON" \
              '[.include[] | .package as $p | select($pkgs | index($p))]')

            if [ "$(printf '%s' "$SELECTED" | jq 'length')" -eq 0 ]; then
              # Shared package directories (pkgs/scripts, pkgs/io-guardian, ...)
              # export packages whose names match no path component, and a
              # non-.nix file can belong to a package we cannot name from its
              # path. Rebuilding everything costs CI minutes; silently skipping
              # an affected package costs a broken master.
              echo "No changed path maps to a known package; keeping full matrix."
              set_matrix "$FULL_MATRIX"
              exit 0
            fi

            MATRIX_JSON=$(jq -cn --argjson include "$SELECTED" '{include:$include}')
            echo "Filtered matrix: $MATRIX_JSON"
            set_matrix "$MATRIX_JSON"

  build-packages:
    needs: discover-packages
    if: ${{ needs.discover-packages.outputs.matrix != '[]' }}
    strategy:
      matrix: ${{ fromJson(needs.discover-packages.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.arch == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    name: Build package ${{ matrix.package }} on ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
        with:
          arch: ${{ matrix.arch }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          ATTIC_ENDPOINT: ${{ secrets.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ secrets.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}

      - name: Build Package
        run: nix build .#${{ matrix.package }} -L --show-trace --no-link --print-out-paths
