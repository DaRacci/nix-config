name: Mirror to Codeberg

on: [push, delete]

jobs:
  mirror:
    if: github.repository == 'DaRacci/nix-config'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mirror to Codeberg
        uses: pixta-dev/repository-mirroring-action@674e65a7d483ca28dafaacba0d07351bdcc8bd75 # v1
        with:
          target_repo_url: "git@codeberg.org:Racci/nix-config.git"
          ssh_private_key: ${{ secrets.MIRROR_SSH_KEY }}
          ssh_username: git
