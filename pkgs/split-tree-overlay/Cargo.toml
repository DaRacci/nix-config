[package]
name = "split-tree-overlay"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "split-tree-overlay"
path = "src/main.rs"

[[bench]]
name = "paint"
path = "benches/paint.rs"
harness = false
# Not a test target: `cargo test` should only run the unit tests.
test = false

[dependencies]
inotify = { version = "0.11", default-features = false }
lexopt = "0.3"
libc = "0.2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
smithay-client-toolkit = { version = "0.21", default-features = false, features = [ "calloop" ] }
wayland-client = "0.31"

[dev-dependencies]
divan = "0.1"
