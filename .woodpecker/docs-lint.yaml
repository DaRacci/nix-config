labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: master
    path:
      - "docs/**"
      - "AGENTS.md"
      - "ci/vale/**"
      - ".vale.ini"
      - ".woodpecker/docs-lint.yaml"
  - event: manual

steps:
  - name: Vale
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: |
      DICT=$(nix build --no-link --print-out-paths 'nixpkgs#hunspellDicts.en_AU-large')
      ./ci/vale/install-dictionaries.sh "$DICT"

      nix run nixpkgs#vale -- docs/ AGENTS.md
