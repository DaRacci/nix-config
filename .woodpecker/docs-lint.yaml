# Lint docs for Australian English spelling with Vale + the Hunspell en_AU
# dictionary (sourced from nixpkgs `hunspellDicts.en_AU`).
#
# Woodpecker is the repository's self-hosted CI (it serves both the GitHub and
# Codeberg forges). The job is scoped to documentation changes so it only runs
# when relevant files move.
labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: master
    path:
      - "docs/**"
      - "AGENTS.md"
      - "ci/vale/**"
      - ".vale.ini"
      - ".woodpecker/docs-lint.yaml"
  - event: manual

steps:
  - name: Vale (Australian English)
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: |
      DICT=$(nix build --no-link --print-out-paths 'nixpkgs#hunspellDicts.en_AU')
      ./ci/vale/install-dictionaries.sh "$DICT"

      # Rule fixtures: locks in that US forms are flagged and AU forms are not.
      nix shell nixpkgs#vale --command ./ci/vale/test/run.sh

      # Lint the real docs tree.
      nix run nixpkgs#vale -- docs/
