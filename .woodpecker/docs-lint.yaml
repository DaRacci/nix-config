labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: master
    path:
      - "docs/**"
      - "AGENTS.md"
      - "flake/dev/devenv.nix"
      - "flake/dev/treefmt.nix"
      - "ci/vale/**"
      - "flake/dev/scripts/**"
      - ".vale.ini"
      - ".woodpecker/docs-lint.yaml"
  - event: manual

steps:
  - name: Vale
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    depends_on: [] # Parallelise
    commands: |
      nix run .#install-vale-dictionaries

      nix run nixpkgs#vale -- docs/ AGENTS.md

  - name: rumdl
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: |
      mkdir -p .devenv
      pwd > .devenv/root
      nix develop .#default \
        --override-input devenv-root "file+file://$PWD/.devenv/root" \
        --command bash -c 'rumdl check docs/ AGENTS.md'
