labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: master
    path:
      - "docs/**"
      - "AGENTS.md"
      - "flake/dev/devenv.nix"
      - "flake/dev/treefmt.nix"
      - "ci/vale/**"
      - "flake/dev/scripts/**"
      - ".vale.ini"
      - ".woodpecker/docs-lint.yaml"
  - event: manual

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 50

steps:
  - name: Vale
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    depends_on: [] # Parallelise
    commands: |
      nix run .#install-vale-dictionaries

      nix run nixpkgs#vale -- docs/ AGENTS.md

  - name: rumdl
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: nix run .#devenv-run -- --shell ci -- rumdl check docs/ AGENTS.md
