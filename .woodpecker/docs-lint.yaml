labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: master
    path:
      - "docs/**"
      - "AGENTS.md"
      - "flake/dev/rumdl.nix"
      - "flake/dev/excludes.nix"
      - "ci/vale/**"
      - "flake/dev/scripts/**"
      - ".vale.ini"
      - ".woodpecker/docs-lint.yaml"
  - event: manual

steps:
  - name: Vale
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    depends_on: [] # Parallelise
    commands: |
      nix run .#install-vale-dictionaries

      nix run nixpkgs#vale -- docs/ AGENTS.md

  - name: rumdl
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: |
      nix run .#rumdl -- check docs/ AGENTS.md
