variables: &env
  BASE_BRANCH: master
  BRANCH: &branch update/package-${PACKAGE}

when:
  - event: manual
  - event: cron
    cron: update-packages

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

matrix:
  PACKAGE:
    - alloy-dynamic-capture-api
    - alloy-dynamic-capture-relay
    - alvr-bin
    - code-review-graph
    - db-guardian-client
    - db-guardian-server
    - hermes-curator-evolver
    - jj-pre-push
    - lidarr-plugins
    - mnemosyne-hermes
    - mnemosyne-memory
    - mnemosyne-memory-all
    - pyarlo
    - pyuptimekuma
    - rtk-hermes
    - ssh-terminal-manager
    - terminal-manager

steps:
  - name: update-package-${PACKAGE}
    image: registry.racci.dev/lix-woodpecker
    environment: *env
    commands: |
      set -euo pipefail

      nix run .#setup-git
      export NIX_PATH=nixpkgs=channel:nixos-unstable
      nix run .#devenv-run -- -- nix-update --flake "${PACKAGE}" --use-update-script --commit || {
        echo "nix-update failed for ${PACKAGE}"
        exit 1
      }

  - name: Push to Branch
    image: appleboy/drone-git-push@sha256:6869b61d74d0fe403267e048ec419ca93a8249f83d90ececa04534d5282c432f
    depends_on:
      - update-package-${PACKAGE}
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: *branch
      rebase: true
      commit: true
      empty_commit: false
      ssh_key:
        from_secret: FORGE_AUTH_KEY

  - name: Create/Update PR
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on:
      - Push to Branch
    environment:
      <<: *env
      FORGE_TOKEN:
        from_secret: FORGE_TOKEN
    commands: |-
      if ! git fetch --depth=1 origin "${BASE_BRANCH}" "$BRANCH"; then
        echo "No branch ${BRANCH} to open a PR from."
        exit 0
      fi

      if git diff --quiet "origin/${BASE_BRANCH}"..."origin/${BRANCH}"; then
        echo "No changes detected for ${PACKAGE}, skipping PR creation."
        exit 0
      fi

      TITLE=$(git log -1 --pretty=%s "origin/${BRANCH}")
      nix run .#create-pr -- \
        --title "$TITLE" \
        --branch "$BRANCH" \
        --base "${BASE_BRANCH}" \
        --labels "dependencies,automated,merge-queue" \
        --reviewers "Racci" \
        --body "This PR was created automatically by the Woodpecker update-packages pipeline."
