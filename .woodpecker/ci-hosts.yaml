variables:
  trigger_paths: &trigger_paths
    - .woodpecker/ci-hosts.yaml
    - flake.nix
    - flake.lock
    - flake/modules.nix
    - flake/packages.nix
    - flake/ci/**
    - flake/nixos/**
    - flake/home-manager/**
    - home/**
    - hosts/**
    - lib/**
    - modules/**
    - overlays/**
    - pkgs/**

labels:
  platform: linux/amd64

when:
  - event: manual
  - event: push
    branch: master
    path: *trigger_paths
  - event: pull_request
    path: *trigger_paths

depends_on:
  - affected

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

matrix:
  HOST:
    - nixai
    - nixarr
    - nixcloud
    - nixdev
    - nixio
    - nixmi
    - nixmon
    - nixserv

steps:
  - name: decide
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: [] # enable parallel steps
    commands: |-
      KEY=$(echo "$${CI_REPO}-$${CI_PIPELINE_NUMBER}" | tr '/' '_')
      FILE="/ci-cache/$${KEY}/hosts.json"
      if [ -f "$${FILE}" ]; then
        if jq -e --arg host "${HOST}" 'index($host)' "$${FILE}" >/dev/null; then
          touch ".do-build-${HOST}"
        fi
      else
        echo "Affected list missing; building ${HOST} to be safe"
        touch ".do-build-${HOST}"
      fi

  - name: build-${HOST}
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: ["decide"]
    environment:
      BINARY_CACHE_TOKEN:
        from_secret: BINARY_CACHE_TOKEN
    commands: |-
      if [ ! -f ".do-build-${HOST}" ]; then
        echo "Skipping build for ${HOST} - not affected by changes"
        exit 0
      fi

      nix run .#setup-attic
      nix run .#archive-flakes -- "." "flake/nixos" "flake/home-manager"
      nix-fast-build --no-nom --attic-cache raccidev --skip-cached --flake ".#nixosConfigurations.${HOST}.config.system.build.toplevel"

  - name: vulnerability-scan-${HOST}
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: ["build-${HOST}"]
    commands: |-
      if [ ! -f ".do-build-${HOST}" ]; then
        echo "Skipping vulnerability scan for ${HOST} - build was skipped"
        exit 0
      fi

      TOPLEVEL=$(nix eval --raw --accept-flake-config ".#nixosConfigurations.${HOST}.config.system.build.toplevel")
      vulnix "$${TOPLEVEL}"
