# Packages are only built on x86_64-linux: this repo has no aarch64 hosts to
# run an arm agent on.
variables:
  trigger_paths: &trigger_paths
    - .woodpecker/ci-packages.yaml
    - flake.nix
    - flake.lock
    - flake/packages.nix
    - flake/ci/**
    - flake/dev/**
    - lib/**
    - overlays/**
    - pkgs/**

labels:
  platform: linux/amd64

when:
  - event: manual
  - event: push
    branch: master
    path: *trigger_paths
  - event: pull_request
    path: *trigger_paths

depends_on:
  - affected

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

matrix:
  PACKAGE:
    - alloy-dynamic-capture-api
    - alloy-dynamic-capture-ctl
    - alloy-dynamic-capture-relay
    - alvr-bin
    - code-review-graph
    - colour-picker
    - compressor
    - db-guardian-client
    - db-guardian-server
    - docs
    - drive-stats
    - hermes-curator-evolver
    - huntress
    - hypr-gamemode
    - jj-desc
    - jj-pre-push
    - lidarr-plugins
    - list-ephemeral
    - lix-woodpecker
    - mnemosyne-hermes
    - mnemosyne-memory
    - mnemosyne-memory-all
    - monocoque
    - new-host
    - ocr-region
    - orca-slicer-git-sync
    - pki2kdbx
    - pyarlo
    - pyuptimekuma
    - rtk-hermes
    - screenshot
    - search
    - serve-docs
    - split-tree-overlay
    - ssh-relay
    - ssh-terminal-manager
    - ssh-to-age-keys
    - sunshine-tools
    - swfs-mount-hooks
    - take-control-viewer
    - terminal-manager
    - uvtools
    - vale-tech-dictionary
    - virtualisation-tools
    - wait-for-db-tools
    - wlprop
    - wyoming-transcribe-client

steps:
  - name: decide
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: [] # enable parallel steps
    commands: |-
      KEY=$(echo "$${CI_REPO}-$${CI_PIPELINE_NUMBER}" | tr '/' '_')
      FILE="/ci-cache/$${KEY}/packages.json"
      if [ -f "$${FILE}" ]; then
        if jq -e --arg package "${PACKAGE}" 'index($package)' "$${FILE}" >/dev/null; then
          touch ".do-build-${PACKAGE}"
        fi
      else
        echo "Affected list missing; building ${PACKAGE} to be safe"
        touch ".do-build-${PACKAGE}"
      fi

  - name: build-${PACKAGE}
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: ["decide"]
    environment:
      BINARY_CACHE_TOKEN:
        from_secret: BINARY_CACHE_TOKEN
    commands: |-
      if [ ! -f ".do-build-${PACKAGE}" ]; then
        echo "Skipping build for ${PACKAGE} - not affected by changes"
        exit 0
      fi

      nix run .#setup-attic
      nix run .#archive-flakes -- "."
      nix-fast-build --no-nom --no-link --attic-cache raccidev --skip-cached --flake ".#packages.x86_64-linux.${PACKAGE}"
