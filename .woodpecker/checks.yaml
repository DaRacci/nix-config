variables:
  - &env
    BASE_BRANCH: &base_branch master
    BRANCH: &branch chore/update-ci-matrix
  - &when_push
    event: [push]
    branch: *base_branch
  - &when_change
    event: [push, pull_request]
    branch: *base_branch
  - &when_cron
    event: cron
    cron: weekly
  - &when_manual
    event: manual
  - &when_all
    - *when_manual
    - *when_change
    - *when_cron
  - &when_ci
    - *when_manual
    - *when_change

labels:
  platform: linux/amd64

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

steps:
  - name: build-flake-checks
    image: registry.racci.dev/lix-woodpecker
    pull: true
    environment:
      BINARY_CACHE_TOKEN:
        from_secret: BINARY_CACHE_TOKEN
    when: *when_ci
    depends_on: [] # enable parallel steps
    commands: |
      nix run .#setup-attic -- --watch
      nix run .#archive-flakes -- "." "flake/ci" "flake/dev"
      nix run nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem)"

  - name: run-flake-checks
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_ci
    depends_on: ["build-flake-checks"]
    commands: |
      nix run .#devenv-run -- --init-only
      nix flake check --override-input devenv-root "file+file://$PWD/.devenv/root"

  - name: check-upstream-todos
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_all
    commands: nix run .#check-upstream-todos

  - name: run-flake-checker
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_all
    commands: nix run nixpkgs#flake-checker

  - name: run-gitguardian
    image: gitguardian/ggshield@sha256:16be3720bb9ef6fc7b4768d6b8c546cf836c8e9fa19a1012556bbaf8af5c4983
    pull: true
    environment:
      GITGUARDIAN_API_KEY:
        from_secret: GITGUARDIAN_API_KEY
    when: *when_ci
    commands: |
      if [ -n "$${CI_PREV_COMMIT_SHA:-}" ]; then
        ggshield secret scan commit-range "$${CI_PREV_COMMIT_SHA}..HEAD"
      else
        ggshield secret scan repo .
      fi

  - name: matrix-ci-hosts.yaml
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_ci
    commands: nix run ".#update-matrix" -- .woodpecker/ci-hosts.yaml HOST .#nixosConfigurations

  - name: matrix-ci-homes.yaml
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_ci
    commands: nix run ".#update-matrix" -- .woodpecker/ci-homes.yaml HOME .#homeConfigurations

  - name: matrix-ci-packages.yaml
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_push
    commands: |
      nix run ".#update-matrix" -- \
        .woodpecker/ci-packages.yaml \
        PACKAGE \
        .#packages.x86_64-linux \
        'pkgs: builtins.filter (name: let r = builtins.tryEval ((builtins.getAttr name pkgs).passthru.ci or true); in r.success && r.value) (builtins.attrNames pkgs)'

  - name: matrix-update-packages.yaml
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_push
    commands: |
      nix run ".#update-matrix" -- \
        .woodpecker/update-packages.yaml \
        PACKAGE \
        .#packages.x86_64-linux \
        'pkgs: builtins.filter (name: let r = builtins.tryEval (let p = builtins.getAttr name pkgs; pt = p.passthru or {}; in (pt ? updateScript) && (pt.discovery or true)); in r.success && r.value) (builtins.attrNames pkgs)'

  - name: push-matrix-updates
    image: appleboy/drone-git-push@sha256:6869b61d74d0fe403267e048ec419ca93a8249f83d90ececa04534d5282c432f
    pull: true
    when: *when_push
    depends_on:
      [
        "matrix-ci-hosts.yaml",
        "matrix-ci-homes.yaml",
        "matrix-ci-packages.yaml",
        "matrix-update-packages.yaml",
      ]
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: *branch
      rebase: true
      commit: true
      empty_commit: false
      author_name: "Woodpecker CI"
      author_email: "woodpecker@racci.dev"
      commit_message: "chore(ci): update CI matrix entries [SKIP CI]"
      ssh_key:
        from_secret: FORGE_AUTH_KEY

  - name: create-matrix-update-pr
    image: registry.racci.dev/lix-woodpecker
    pull: true
    when: *when_push
    depends_on: ["push-matrix-updates"]
    environment:
      <<: *env
      FORGE_TOKEN:
        from_secret: FORGE_TOKEN
    commands: |-
      # avoid creating PRs with no changes
      git fetch --depth=1 origin "${BASE_BRANCH}"
      if git diff --quiet "origin/${BASE_BRANCH}"...HEAD; then
        echo "No changes detected, skipping PR creation."
        exit 0
      fi

      TITLE=$(git log -1 --pretty=%s)
      nix run .#create-pr -- \
        --title "$TITLE" \
        --branch "$BRANCH" \
        --base "${BASE_BRANCH}" \
        --labels "automated,merge-queue" \
        --reviewers "Racci" \
        --body "This PR was created automatically by the Woodpecker CI pipeline to update the CI matrix entries based on changes to the configuration files."
