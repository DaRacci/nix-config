labels:
  platform: linux/amd64

when:
  - event: manual
  - event: [push, pull_request]
    branch: master

steps:
  - name: Evaluate home configurations
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    commands: |
      set -eu

      configs=$(nix eval --json .#homeConfigurations --apply builtins.attrNames | jq -r '.[]')
      if [ -z "$configs" ]; then
        echo "No home configurations found in .#homeConfigurations." >&2
        exit 1
      fi

      printf '%s\n' "$configs" | while IFS= read -r config; do
        echo "Evaluating homeConfigurations.$config"
        nix eval --raw ".#homeConfigurations.\"$config\".activationPackage.drvPath"
        echo
      done

  - name: Build flake checks
    image: registry.racci.dev/lix-woodpecker:latest
    pull: true
    environment:
      binary_cache_token:
        from_secret: binary_cache_token
    commands: |
      nix run .#setup-attic -- --watch
      nix run .#archive-flakes -- "." "flake/ci" "flake/dev"
      nix run nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem)"

  - name: Run flake checks
    image: registry.racci.dev/lix-woodpecker:latest
    commands: nix flake check
