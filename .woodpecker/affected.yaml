# Compute affected outputs once per pipeline.
#
# Build workflows depend on this workflow and read the JSON files from the shared /ci-cache volume.
variables:
  trigger_paths: &trigger_paths
    - .woodpecker/affected.yaml
    - .woodpecker/ci-homes.yaml
    - .woodpecker/ci-hosts.yaml
    - .woodpecker/ci-packages.yaml
    - flake.nix
    - flake.lock
    - flake/modules.nix
    - flake/packages.nix
    - flake/ci/**
    - flake/dev/**
    - flake/home-manager/**
    - flake/nixos/**
    - home/**
    - hosts/**
    - lib/**
    - modules/**
    - overlays/**
    - pkgs/**

labels:
  platform: linux/amd64

when:
  - event: manual
  - event: push
    branch: master
    path: *trigger_paths
  - event: pull_request
    path: *trigger_paths

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

steps:
  - name: compute
    image: registry.racci.dev/lix-woodpecker
    pull: true
    commands: |
      set -euo pipefail

      KEY=$(echo "$${CI_REPO}-$${CI_PIPELINE_NUMBER}" | tr '/' '_')
      DIR="/ci-cache/$${KEY}"
      mkdir -p "$${DIR}"

      # Keep the shared cache bounded.
      find /ci-cache -mindepth 1 -maxdepth 1 -type d -mmin +120 -exec rm -rf {} +

      nix run .#decide-affected -- hosts --json "$${DIR}/hosts.json"
      nix run .#decide-affected -- homes --json "$${DIR}/homes.json"
      nix run .#decide-affected -- packages --json "$${DIR}/packages.json"
