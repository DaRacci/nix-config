# Pipeline to build and publish the lix-woodpecker image when the image
# definition or any flake input changes.
#
# This pipeline runs on pushes to master that modify `flake.lock` or
# `pkgs/lix-woodpecker/`. Any input bump can change the image, so the whole
# lock file is treated as relevant.

when:
  - event: push
    branch: master
    path: [flake.lock, pkgs/lix-woodpecker/**]

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

steps:
  - name: Check for input changes
    image: registry.racci.dev/lix-woodpecker
    pull: true
    commands: |
      if [ -z "$${CI_PREV_COMMIT_SHA:-}" ]; then
        echo "CI_PREV_COMMIT_SHA not set; assuming changes occurred."
        echo "SHOULD_PUBLISH=true" >> envvar
        exit 0
      fi

      if git diff --quiet "$${CI_PREV_COMMIT_SHA}" HEAD -- flake.lock pkgs/lix-woodpecker/; then
        echo "No relevant changes; skipping publish."
        echo "SHOULD_PUBLISH=false" >> envvar
      else
        echo "Detected changes to flake.lock or pkgs/lix-woodpecker/; will publish."
        echo "SHOULD_PUBLISH=true" >> envvar
      fi

  - name: Publish to Registry
    image: registry.racci.dev/lix-woodpecker
    environment:
      REGISTRY_USER:
        from_secret: REGISTRY_USER
      REGISTRY_TOKEN:
        from_secret: REGISTRY_TOKEN
    commands: |
      . envvar
      if [ "$SHOULD_PUBLISH" = "true" ]; then
        echo "Publishing lix-woodpecker image to registry..."
        nix run ".#lix-woodpecker.copyToRegistry" -- --dest-creds "$REGISTRY_USER:$REGISTRY_TOKEN"
      else
        echo "Skipping publish step."
      fi
