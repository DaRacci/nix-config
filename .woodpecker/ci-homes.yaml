variables:
  trigger_paths: &trigger_paths
    - .woodpecker/ci-homes.yaml
    - flake.nix
    - flake.lock
    - flake/modules.nix
    - flake/packages.nix
    - flake/ci/**
    - flake/home-manager/**
    - home/**
    - lib/**
    - modules/fragments/**
    - modules/home-manager/**
    - overlays/**
    - pkgs/**

labels:
  platform: linux/amd64

when:
  - event: manual
  - event: push
    branch: master
    path: *trigger_paths
  - event: pull_request
    path: *trigger_paths

depends_on:
  - affected

clone:
  - name: git
    image: woodpeckerci/plugin-git@sha256:b49127ebd592cde07fb7a08c68025b1ea2f44f21cd4bd1440dbfe042a02c1581
    settings:
      partial: false
      depth: 0

concurrency: 1

matrix:
  HOME:
    - racci

steps:
  - name: decide
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: [] # enable parallel steps
    commands: |-
      KEY=$(echo "$${CI_REPO}-$${CI_PIPELINE_NUMBER}" | tr '/' '_')
      FILE="/ci-cache/$${KEY}/homes.json"
      if [ -f "$${FILE}" ]; then
        if jq -e --arg home "${HOME}" 'index($home)' "$${FILE}" >/dev/null; then
          touch ".do-build-${HOME}"
        fi
      else
        echo "Affected list missing; building ${HOME} to be safe"
        touch ".do-build-${HOME}"
      fi

  - name: build-${HOME}
    image: registry.racci.dev/lix-woodpecker
    pull: true
    depends_on: ["decide"]
    environment:
      BINARY_CACHE_TOKEN:
        from_secret: BINARY_CACHE_TOKEN
    commands: |-
      if [ ! -f ".do-build-${HOME}" ]; then
        echo "Skipping build for ${HOME} - not affected by changes"
        exit 0
      fi

      nix run .#setup-attic
      nix run .#archive-flakes -- "." "flake/nixos" "flake/home-manager"
      nix-fast-build --no-nom --no-link --attic-cache raccidev --skip-cached --flake ".#homeConfigurations.${HOME}.activationPackage"
